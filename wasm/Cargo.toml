[workspace]

[package]
name = "musyboard-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Ponte WASM verso keyboard-cipher-core, per l'esecuzione dentro Scriptable (iOS)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
keyboard-cipher-core = { path = ".." }
rand_core = "0.6"
rand_chacha = "0.3"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
strip = "debuginfo"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
